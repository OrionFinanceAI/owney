[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "owney"
version = "0.1.0"
description = "Owney USDC/WETH Orion strategist keeper (Zyfai simulate → submit intent)"
requires-python = ">=3.11,<3.14"
readme = "README.md"
authors = [{ name = "Orion Finance" }]
dependencies = [
    "orion-finance-sdk-py>=2.2.0",
    "python-dotenv>=1.1.0,<2.0.0",
    "typer>=0.16.0,<1.0.0",
    "web3>=7.12.0,<8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5,<9.2.0",
]

[project.scripts]
owney = "owney.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
